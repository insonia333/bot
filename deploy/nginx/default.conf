# Moom Agency — Nginx Configuration

# Gzip compression
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

# Security headers
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' cdn.jsdelivr.net fonts.googleapis.com; style-src 'self' 'unsafe-inline' fonts.googleapis.com; font-src fonts.gstatic.com; img-src 'self' data:; connect-src 'self';" always;

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name moomagencia.com www.moomagencia.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Main site
server {
    listen 443 ssl http2;
    server_name moomagencia.com www.moomagencia.com;

    # SSL certificates (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/moomagencia.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/moomagencia.com/privkey.pem;

    # SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Root site
    root /usr/share/nginx/html;

    # Main site
    location / {
        root /usr/share/nginx/html/site;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Demo sites
    location /demos/ {
        alias /usr/share/nginx/html/demos/;
        index index.html;
        try_files $uri $uri/ =404;
    }

    # Marketing pages
    location /marketing/ {
        alias /usr/share/nginx/html/marketing/;
        index index.html;
        try_files $uri $uri/ =404;
    }

    # Legal pages
    location /legal/ {
        alias /usr/share/nginx/html/legal/;
        index index.html;
        try_files $uri $uri/ =404;
    }

    # Sitemap and robots
    location = /sitemap.xml {
        root /usr/share/nginx/html;
    }

    location = /robots.txt {
        root /usr/share/nginx/html;
    }

    # Cache static assets
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(css|js)$ {
        expires 1M;
        add_header Cache-Control "public";
    }

    location ~* \.(woff|woff2|ttf|otf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
    }

    # Error pages
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
}
